description = "intersection mix zone with a threshold: four OBUs loop four blocks around a crossing and change identity in the 40 m zone only once three of them are inside, the first three together; patient eavesdropper (15 s link window)"

# Layout: crossing at 40.208106, -8.4197756 (RSU; Rua Alexandre Herculano x Rua
# Venancio Rodrigues, Coimbra), four 150 m blocks around it (0.00135 deg latitude,
# 0.00177 deg longitude). Each OBU drives clockwise around one block at 36 km/h (60 s a lap)
# and turns right at the crossing, so it arrives on one road and leaves on another:
#   obu1 (NE block) arrives from the east,  leaves north
#   obu2 (NW block) arrives from the north, leaves west
#   obu3 (SW block) arrives from the west,  leaves south
#   obu4 (SE block) arrives from the south, leaves east
# Every road carries one car into the crossing and another out of it. The cars arrive 1.5 s
# apart and each is within 40 m of the centre for 8 s. With min_vehicles = 3, obu1 and obu2
# wait inside the zone; when obu3 enters 3 s after obu1, the mobility client sends all three
# their pseudonym change event in the same tick, and obu4 gets its event on entry. The
# 6-12 s silent period (60-120 m at 10 m/s) covers the rest of the turn.
# Same layout as c-its-pki-mixzone, which changes each car on entry.

[network]
name = "vanetzalan0"
subnet = "192.168.98.0/24"

[defaults]
security = "certs-v3"
aa_cert = "/vnap-certs/c-its-pki/aa.cert"
root_cert = "/vnap-certs/c-its-pki/root_ca.cert"

[[stations]]
name = "rsu"
ip = "192.168.98.10"
station_id = 1
station_type = 15
mac = "6e:06:e0:03:00:01"
at_cert = "/vnap-certs/c-its-pki/at.cert"
at_key = "/vnap-certs/c-its-pki/at.der"
env = { VANETZA_LATITUDE = "40.208106", VANETZA_LONGITUDE = "-8.4197756" }

# 24 butterfly ATs, 6 per car: about 6 laps (6 minutes) before a certificate repeats
[[stations]]
name = "obu1"
ip = "192.168.98.20"
station_id = 2
station_type = 5
mac = "6e:06:e0:03:00:02"
pseudonyms = { cert = "/vnap-certs/c-its-pki/bke_at_{i}.cert", key = "/vnap-certs/c-its-pki/bke_at_{i}_sign.der", first = 0, count = 6, min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { route = [[40.208106, -8.4180102], [40.208106, -8.4197756], [40.209456, -8.4197756], [40.209456, -8.4180102]], speed_kmh = 36, start_s = 0, loop = true }

[[stations]]
name = "obu2"
ip = "192.168.98.30"
station_id = 3
station_type = 5
mac = "6e:06:e0:03:00:03"
pseudonyms = { cert = "/vnap-certs/c-its-pki/bke_at_{i}.cert", key = "/vnap-certs/c-its-pki/bke_at_{i}_sign.der", first = 6, count = 6, min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { route = [[40.209456, -8.4197756], [40.208106, -8.4197756], [40.208106, -8.421541], [40.209456, -8.421541]], speed_kmh = 36, start_s = 1.5, loop = true }

[[stations]]
name = "obu3"
ip = "192.168.98.40"
station_id = 4
station_type = 5
mac = "6e:06:e0:03:00:04"
pseudonyms = { cert = "/vnap-certs/c-its-pki/bke_at_{i}.cert", key = "/vnap-certs/c-its-pki/bke_at_{i}_sign.der", first = 12, count = 6, min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { route = [[40.208106, -8.421541], [40.208106, -8.4197756], [40.206756, -8.4197756], [40.206756, -8.421541]], speed_kmh = 36, start_s = 3, loop = true }

[[stations]]
name = "obu4"
ip = "192.168.98.50"
station_id = 5
station_type = 5
mac = "6e:06:e0:03:00:05"
pseudonyms = { cert = "/vnap-certs/c-its-pki/bke_at_{i}.cert", key = "/vnap-certs/c-its-pki/bke_at_{i}_sign.der", first = 18, count = 6, min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { route = [[40.206756, -8.4197756], [40.208106, -8.4197756], [40.208106, -8.4180102], [40.206756, -8.4180102]], speed_kmh = 36, start_s = 4.5, loop = true }

[control]
network = "vnapctl0"
subnet = "192.168.99.0/24"
broker_ip = "192.168.99.2"
client_ip = "192.168.99.3"
mobility_ip = "192.168.99.4"
mobility_rate_hz = 5

[[control.mix_zones]]
# a car that entered changes only once 3 cars are inside; one that leaves before keeps its pseudonym
name = "crossing"
center = [40.208106, -8.4197756]
radius_m = 40
min_vehicles = 3

[control.client]
# no clock-driven changes: identities change only in the mix zone (the client still logs
# the stations' answers)
mode = "manual"

[eavesdropper]
# patient attacker: continues a track up to 15 s after it went silent
link_window = 15.0
summary_interval = 30

[check]
expect = ["eavesdropper.decode_errors==0", "eavesdropper.tracks>=6"]
