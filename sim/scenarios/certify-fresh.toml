description = "certs-v2 with the certify root/AA and per-station ATs issued 2026-09-24 (valid to 2026-11-23)"

[network]
name = "vanetzalan0"
subnet = "192.168.98.0/24"

[defaults]
security = "certs-v2"
aa_cert = "/vnap-certs/certify/aa_vnap.cert"
