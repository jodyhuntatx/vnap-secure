# A template users may start: no addresses, networks or certificate files (the service assigns them).
description = "random-turn intersection mix zone with the run's own PKI: four OBUs, identity change in a 40 m zone, 6-12 s silence; eavesdropper with timing and position linking"

# Layout: crossing at 40.0, -8.0 (RSU) with four 150 m roads (arms) ending on a square ring
# road. Each lap (600 m, 60 s at 36 km/h) a car comes in on one arm, turns left, straight or
# right at random at the crossing (no U-turns), drives to the end of its exit arm, goes a
# random way along the ring to the next arm and comes back in on it. Exits and arrivals are
# therefore both random, unlike c-its-pki-mixzone, where every car always turns right on the
# same block and the eavesdropper's mistakes form one rotation that an attacker could undo.
# The cars start on different arms and reach the crossing 1.5 s apart on every lap. Each car
# gets a pseudonym change event on entering the 40 m zone; the 6-12 s silent period covers
# the turn. The turns come from control.mobility_seed (set it to repeat a run; otherwise
# vnapctl picks one and records it in the mobility client's configuration, shown by status).

[defaults]
security = "certs-v3"

[[stations]]
name = "rsu"
station_type = 15
env = { VANETZA_LATITUDE = "40.0", VANETZA_LONGITUDE = "-8.0" }

[[stations]]
name = "obu1"
station_type = 5
pseudonyms = { min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { crossing = [40.0, -8.0], arm_m = 150, start_arm = "east", speed_kmh = 36, start_s = 0 }

[[stations]]
name = "obu2"
station_type = 5
pseudonyms = { min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { crossing = [40.0, -8.0], arm_m = 150, start_arm = "north", speed_kmh = 36, start_s = 1.5 }

[[stations]]
name = "obu3"
station_type = 5
pseudonyms = { min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { crossing = [40.0, -8.0], arm_m = 150, start_arm = "west", speed_kmh = 36, start_s = 3 }

[[stations]]
name = "obu4"
station_type = 5
pseudonyms = { min_interval_ms = 1000, silent_min_ms = 6000, silent_max_ms = 12000 }
mobility = { crossing = [40.0, -8.0], arm_m = 150, start_arm = "south", speed_kmh = 36, start_s = 4.5 }

[pki]
# defaults: 8 initial certificates per car, a batch of 8 requested at 2 unused
validity_hours = 24

[control]
mobility_rate_hz = 5

[[control.mix_zones]]
# the mobility client sends a pseudonym change event to each car entering the zone
name = "crossing"
center = [40.0, -8.0]
radius_m = 40

[control.client]
# no clock-driven changes: identities change only in the mix zone (the client still logs
# the stations' answers)
mode = "manual"

[eavesdropper]
# patient attacker: continues a track up to 15 s after it went silent
link_window = 15.0
summary_interval = 30

[check]
expect = ["eavesdropper.decode_errors==0", "eavesdropper.tracks>=6"]
