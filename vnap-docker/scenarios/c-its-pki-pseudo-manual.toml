description = "as c-its-pki, but the OBU holds butterfly ATs bke_at_0..7 and changes pseudonym on control channel events"

[network]
name = "vanetzalan0"
subnet = "192.168.98.0/24"

[defaults]
security = "certs-v3"
aa_cert = "/vnap-certs/c-its-pki/aa.cert"
root_cert = "/vnap-certs/c-its-pki/root_ca.cert"

[[stations]]
name = "rsu"
ip = "192.168.98.10"
station_id = 1
station_type = 15
mac = "6e:06:e0:03:00:01"
at_cert = "/vnap-certs/c-its-pki/at.cert"
at_key = "/vnap-certs/c-its-pki/at.der"

[[stations]]
name = "obu"
ip = "192.168.98.20"
station_id = 2
station_type = 5
mac = "6e:06:e0:03:00:02"
pseudonyms = { cert = "/vnap-certs/c-its-pki/bke_at_{i}.cert", key = "/vnap-certs/c-its-pki/bke_at_{i}_sign.der", count = 8, min_interval_ms = 1000 }

[control]
network = "vnapctl0"
subnet = "192.168.99.0/24"
broker_ip = "192.168.99.2"
client_ip = "192.168.99.3"

[control.client]
mode = "manual"
