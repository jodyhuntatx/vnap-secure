# vnap-secure simulation service (API) configuration. Paths are relative to this directory.

[server]
data_dir = "data"              # database, user scenarios, collected results
# FOR TESTING ONLY, NOT FOR A PRODUCTION DEPLOYMENT: with false the session cookie is also sent
# over plain http://, so the service works out of the box in every browser on a development VM
# (Safari and DuckDuckGo drop an HTTPS-only cookie even on http://localhost).
# In production set cookie_secure = true: the cookie is then sent only over HTTPS, and login
# over plain HTTP from another host is refused. Without this key the service uses true.
cookie_secure = false
session_hours = 12

[auth]
max_failed_logins = 5          # then the account is locked for lockout_minutes
lockout_minutes = 15
login_attempts_per_minute = 10 # per client address
# Optional TOTP second factor (each user turns it on under Account). The TOTP secrets are
# encrypted with this key, created on first use and kept OUTSIDE data_dir, so it is not in the
# backups: keep a copy of it somewhere safe. Without it, every user's TOTP must be reset.
totp_issuer = "vnap-secure"    # the name authenticator apps show
totp_key_file = "secrets/totp.key"

# python3 -m vnapapi.backup create (deploy/vnap-backup.timer runs it daily): database, results and
# user scenarios in one checksummed archive; the oldest beyond `keep` are deleted
[backup]
dir = "backups"
keep = 14

# per role: runs at the same time, longest run (stopped automatically), space for kept results
[limits.user]
concurrent_runs = 2
max_duration_minutes = 60
results_mb = 500

[limits.admin]
concurrent_runs = 10
max_duration_minutes = 480
results_mb = 5000

# resource limits of the containers of every run, per role (vnap.role label)
[containers.station]
cpus = 1.0
memory = "512m"

[containers.pki]
cpus = 1.0
memory = "512m"

[containers.default]
cpus = 0.5
memory = "256m"

# web UI: map tiles (the browser loads them; the CSP allows only this origin besides the service)
[ui]
tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
tile_attribution = "&copy; OpenStreetMap contributors"

[worker]
threads = 2                    # runs starting or stopping at the same time
